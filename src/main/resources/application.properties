# ============================================================================
# CONFIGURACIÓN PRINCIPAL - SITE Dashboard Service v1.0
# ============================================================================

# Identificación de la aplicación
spring.application.name=dashboard-service

# Puerto del servidor
server.port=${PORT:8082}

# ============================================================================
# DOCUMENTACIÓN API - SWAGGER / OpenAPI
# ============================================================================

# Endpoint para obtener el esquema OpenAPI en JSON
springdoc.api-docs.path=/api/v1/docs

# Swagger UI accesible en navegador
springdoc.swagger-ui.path=/swagger-ui.html

# Información de la aplicación en Swagger
springdoc.api-info.title=SITE Dashboard Service
springdoc.api-info.description=API de lectura del panel de control electoral para el Sistema Electoral Transparente Electrónico v2.1
springdoc.api-info.version=1.0.0

# ============================================================================
# LOGGING
# ============================================================================

# Nivel de logging global
logging.level.root=INFO

# Nivel de logging específico para el package de la aplicación
logging.level.com.electoral=DEBUG

# Patrón de logging (sin marcas de tiempo para ambiente de desarrollo)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
